name: mobile_app
description: A new Flutter project.
version: 1.0.0+1

environment:
  sdk: '>=2.17.0 <3.0.0'

# -------------------------
# Your app's dependencies
# -------------------------
dependencies:
  flutter:
    sdk: flutter

  # For making API calls
  http: ^1.2.1

  # For saving the auth token securely
  shared_preferences: ^2.2.3

  # For state management
  provider: ^6.1.2

  # For the attendance chart
  fl_chart: ^0.68.0

  # For date formatting
  intl: ^0.19.0

  # This is a standard package, good to have
  cupertino_icons: ^1.0.2

# -------------------------
# Development-only dependencies
# -------------------------
dev_dependencies:
  flutter_test:
    sdk: flutter

  # You can add this for code linting
  # flutter_lints: ^3.0.0

# -------------------------
# Flutter-specific settings
# -------------------------
flutter:
  uses-material-design: true

  # Your assets (images)
  assets:
    - assets/images/